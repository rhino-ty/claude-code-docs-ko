name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          cp *.md docs/
          cp -r en docs/en

      - name: Deploy
        run: mkdocs gh-deploy --force
